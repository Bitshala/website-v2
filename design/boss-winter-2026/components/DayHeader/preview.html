<!-- @dsCard group="Schedule" height=260 subtitle="Day header bar: a talk day, the orientation day, and a narrow (mobile) container." -->
<div class="boss" style="padding:24px;display:grid;gap:22px">
  <div id="a"></div><div id="b"></div>
  <div class="boss" id="c" style="max-width:360px"></div>
</div>
<script>
  var B = window.BOSS, d = B.schedule;
  document.getElementById('a').innerHTML = B.html.dayHeader(d, d.days[1], 1);
  document.getElementById('b').innerHTML = B.html.dayHeader(d, d.days[0], 0);
  document.getElementById('c').innerHTML = B.html.dayHeader(d, d.days[2], 2);
</script>
