<!-- @dsCard group="Site" height=300 subtitle="Nav row, the Winter 2026 Agenda heading and the season pills: the only place accents appear." -->
<div class="boss" style="padding:28px 32px;display:grid;gap:28px">
  <div id="nav"></div>
  <div id="head"></div>
  <div id="pills"></div>
</div>
<script>
  var B = window.BOSS;
  document.getElementById('nav').innerHTML = B.html.nav();
  document.getElementById('head').innerHTML = B.html.heading(B.schedule);
  document.getElementById('pills').innerHTML = B.html.seasonPills(['Winter 2026', 'Summer 2026'], 'Winter 2026');
</script>
