name: Deploy to GitHub Pages

env:
  GOOGLE_KEY: ${{ secrets.GOOGLE_KEY }}

on:
  # Trigger the workflow every time you push to the `main` branch
  # Using a different branch name? Replace `main` with your branch’s name
  push:
    branches: [main]
  # Also triggered by the "Update X feed" workflow when the feed changes.
  # Allows you to run this workflow manually from the Actions tab on GitHub.
  workflow_dispatch:

# Allow this job to clone the repo and create a page deployment
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v4
      # The X feed cache is kept on the x-feed branch (see update-feed.yml).
      - name: Use latest X feed cache
        run: |
          if git fetch --depth=1 origin x-feed; then
            git show FETCH_HEAD:data/podcasts-articles.json > data/podcasts-articles.json
          else
            echo "No x-feed branch yet; using the feed on main."
          fi
      - name: Install, build, and upload your site
        uses: withastro/action@v2
        # with:
        # path: . # The root location of your Astro project inside the repository. (optional)
        # node-version: 18 # The specific version of Node that should be used to build your site. Defaults to 18. (optional)
        # package-manager: pnpm@latest # The Node package manager that should be used to install dependencies and build your site. Automatically detected based on your lockfile. (optional)

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
